<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password reset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color: rgb(255, 250, 235);">

  <!-- Outer Background Wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" 
         style="background-color: rgb(255, 250, 235); padding: 40px 0;">
    <tr>
      <td align="center">

        <!-- Main Container -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" 
               style="width:600px; max-width:600px; background-color: rgb(245, 245, 245); border:1px solid #d0d0d0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

          <!-- Header -->
          <tr>
            <td style="padding: 24px 32px; border-bottom: 1px solid #d0d0d0;">

              <!-- Logo -->
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="left">
                    <img src="https://registerfor.events/assets/images/site-logo-with-text.png"
                         width="150"
                         alt="Register For Events"
                         style="display:block; border:0; outline:none; text-decoration:none;">
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Body Content -->
          <tr>
            <td style="padding: 32px; color:#222222; font-size:14px; line-height:1.6;">

              <h1>Hi {{ user.get_username }},</h1>
              <p>Click the link below to reset your password:</p>
              <p>
                <a 
                  href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                  style="display:inline-block;
                        padding:12px 18px;
                        font-size:14px;
                        font-weight:600;
                        color:#ffffff;
                        text-decoration:none;
                        background-color:#555555;
                        border:1px solid #444444;"
                  >
                  Reset Password
                </a>
              </p>
              <p>If you didn’t request this, ignore this email.</p>

            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="border-top:1px solid #d0d0d0;"></td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 32px; font-size:12px; color:#666666; line-height:1.5;">
              <p style="margin:0 0 8px 0;">
                Register For Events
              </p>
              <p style="margin:0;">
                This is a transactional email related to your account.
              </p>
            </td>
          </tr>

        </table>

        <!-- Spacer -->
        <table width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;">
          <tr>
            <td style="padding:20px; font-size:11px; color:#999999; text-align:center; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
              © 2026 Register For Events. All rights reserved.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
