{% extends "base/base.html" %}

{% block content %}

<h1>Reset Your Password</h1>

<form method="post">
  <h2>Request a reset link.</h2>
  <br>
  {% csrf_token %}
  <table class="form-as-table">
  {{ form.as_table}}
  </table>
  <button type="submit">Send reset link</button>
</form>

{% endblock content %}
