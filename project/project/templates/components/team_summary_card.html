<div>
  <div style="display: flex; flex-direction: row; justify-content: space-around; margin-bottom: 1rem;">

    <div class="img-team-photo__container-medium"
      <img src="{{ team.get_photo_url }}" class="img-fill">
    </div>

    <div>
      <h2>Info</h2>
      <dl>
        <dt>Name</dt>

        <dd>
          <strong>{{ team.name }}</strong>
          <a href="{% url 'explore:team' team_id=team.id %}" class="inline-icon__link">
            <img src="/assets/icons/magnifying-glass.svg" class="inline-icon"><a></td>
          </a>
        </dd>

        <dt>Sport</dt><dd>{{ team.get_sport_display }}</dd>
        <dt>Gender</dt><dd>{{ team.get_gender_display }}</dd>
        <dt>Division</dt><dd>{{ team.get_division_display }}</dd>
      </dl>
    </div>

  </div>

</div>
