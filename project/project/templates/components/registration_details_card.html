<table class="item-table">

  <tbody>
    <tr>
      <th>Event</th>
      <td>
        {{registration.event.name}}
        <a href="{% url "explore:event" event_id=registration.event.id %}" class="inline-icon__link">
              <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
    </tr>
    <tr>
      <th>Host</th>
      <td>
        {{registration.event.owner.profile.name }}
        <a href="{% url "explore:profile" profile_id=registration.event.owner.profile.id %}" class="inline-icon__link">
          <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
    </tr>
    <tr>
      {% for item in registration.items.all %}
      <th>Team Registered</th>
      <td>
        {{ item.team.name}} - {{ item.division.name}} {{ item.division.gender }}
        <a href="{% url "explore:team" team_id=item.team.id %}" class="inline-icon__link">
          <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
      {% endfor %}
    </tr>
  </tbody>

</table>
