<table class="item-table">

  <thead>
    <tr>
      <th>Event</th>
      <th>Host</th>
      <th>Team</th>
      <th>Divistion</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>
        {{registration.event.name}}
        <a href="{% url "details:event" event_id=registration.event.id %}" class="inline-icon__link">
              <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
      <td>
        {{registration.event.owner.profile.name }}
        <a href="{% url "details:profile" profile_id=registration.event.owner.profile.id %}" class="inline-icon__link">
          <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
      <td>
        {{registration.team.name}}
        <a href="{% url "details:team" team_id=registration.team.id %}" class="inline-icon__link">
          <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
      <td>
        {{registration.assigned_division.name}} {{ registration.assigned_division.gender }}
        <a href="{% url "details:division" division_id=registration.assigned_division.id %}" class="inline-icon__link">
          <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
        </a>
      </td>
    </tr>
  </tbody>

</table>
