<!-- Main Container -->
<table width="100%" height="100%"cellpadding="0" cellspacing="0" border="0"
       style="width:100%; max-width:500px;
              background-color: rgb(245, 245, 245); border:1px solid #d0d0d0;
              font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <!-- Header -->
  <tr>
    <td style="padding: 15px 20px 10px; border-bottom:1px solid #d0d0d0;">
      <h2 style="margin:0; font-size:18px; font-weight:600; color:#333;">
        You're Invited
      </h2>
    </td>
  </tr>

  <!-- Body Content -->
  <tr>
    <td style="padding: 15px 20px 10px; color:#222222; font-size:14px; line-height:1.6;">

      <h1 style="margin:0; padding: 0; font-size:26px; font-weight:700; color:#111;">
        {{ event.name }}
      </h1>


        <!-- Event Details -->
        <div style="display: flex; flex-direction: row; gap: 16px">

          <div>
            <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px; border-collapse:collapse; font-size:14px;">
              <tbody>
                <tr>
                  <th align="left" style="padding:3px 0; color:#666; font-weight:600;">Starting</th>
                  <td>{{ event.start_date }}</td>
                </tr>
                <tr>
                  <th align="left" style="padding:6px 0; color:#666; font-weight:600;">Goes To</th>
                  <td>{{ event.end_date }}</td>
                </tr>
                <tr>
                  <th align="left" style="padding:6px 0; color:#666; font-weight:600;">Location</th>
                  <td>{{ event.address }} {{ event.city }} {{ event.state }}</td>
                </tr>
                <tr>
                  <th align="left" style="padding:6px 0; color:#666; font-weight:600;">Hosted by</th>
                  <td>{{ event.owner.profile.name }}</td>
                </tr>
              </tbody>
            </table>
          </div>

        <!-- Poster -->
        <div style="min-width: 150px;
                    min-height: 150px;
                    margin-bottom:24px;
                    text-align:center;
                    background-color: white;
                    border: 1px solid #aaaaaa;
                    border-radius: 3px;
                    ">
          <img src="{{ site_url }}{{ event.get_poster_url }}"
               alt="{{ event.name }}"
               style="width:150px; min-height:150px; border-radius:6px; border:1px solid #dddddd;">
        </div>
      </div>

        <a style="display: block;
                  padding: 12px 18px;
                  font-size: 15px;
                  font-weight: 600;
                  color: #ffffff;
                  text-decoration: none;
                  background-color: #2e7d32;
                  border: 1px solid #256428;
                  border-radius: 4px;
                  cursor: pointer;
                  text-align: center;
                  width: max-content;
                  margin: 0 auto;"
                  href="{% url 'app:event_invite' event_id=event.id %}"
                  target="_blank"
                  >
          Grab Your Spot
        </a>

    </td>
  </tr>

  <!-- Divider -->
  <tr>
    <td style="border-top:1px solid #d0d0d0;"></td>
  </tr>

  <!-- Footer -->
  <tr>
    <td style="padding:12px 32px 12px; font-size:12px; color:#666666; line-height:1.5;">
      <p style="margin:0;">
        Register For Events
      </p>
    </td>
  </tr>

</table>
