{% extends "mailbox/base.html" %}


{% block working %}
<table>
  <tbody>
    {% for convo in conversations %}
      {% for part in convo.participants.all %}
        {% if part != user.profile %}
        <tr>
          <td>
            <a href="{% url 'mailbox:conversation' user_id=part.id %}">{{ part }}</a>
          </td>
        </tr>
        {% endif %}
      {% endfor %}
    {% endfor %}
  </tbody>
</table>
{% endblock %}
