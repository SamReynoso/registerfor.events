{% extends "app/base.html" %}

{% block content %}
  <h2>Update Event</h2>
  <form method="post">
    {% csrf_token %}
    <table class="form-as-table">
      {{ form.as_table }}
    </table>
    <button type="submit">Update</button>
  <ul class="nav-list">
    <li><a href="{% url 'app:event_status' event_id=event.id %}">Change Visibility</a></li>
  </ul>

  </form>

{% endblock %}
