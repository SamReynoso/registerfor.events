{% extends "app/base.html" %}

{% block content %}
  <h2>Event Status</h2>
  <h3>{{ event.name }}</h3>
  <a href="{% url 'user:hosting_event' event_id=event.id %}">View</a>
  <ul>
    <li>
      public: {{ event.public }}
    </li>
  </ul>
  <form method="post">
      {% csrf_token %}
      <button type="submit">Toggle Visibility</button>
  </form>
{% endblock %}
