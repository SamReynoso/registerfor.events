{% extends "app/base.html" %}

{% block content %}
  <h1>Update Team</h1>
  <form method="post" class="event-search-form">
    <h2>Team Info</h2>
    {% csrf_token %}
    <table class="form-as-table">
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      {{ form.as_table }}
    </table>
    <button type="submit">Update</button>
  </form>
{% endblock %}
