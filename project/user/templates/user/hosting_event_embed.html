{% extends "user/base.html" %}

{% block content %}


<h1>Embed On Your Site</h1>


<iframe 
  src="{{ site_url }}{% url 'details:event_embedded' event_id=event.id %}"
  width="100%" 
  height="1000" 
  frameborder="0"
  style="border:0;"
></iframe>

<div style="padding: 40px; fontFamily: sans-serif;" >
  <h1>Create Embed Code</h1>

  <h2>Copy This:</h2>

  <textarea
    value="iframeCode"
    readOnly
    rows=6
    style="width: 100%; padding: 10px; fontFamily: monospace; fontSize: 14px;"
    >
    iframecode
  </textarea>

  <p style="margin-top: 10px; fontSize: 14px; color: #666;">
    Paste this into any website HTML.
  </p>
</dev>


{% endblock %}
