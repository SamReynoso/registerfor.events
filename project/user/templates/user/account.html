{% extends "user/base.html" %}

{% block content %}
<h2>Dashboard</h2>
{% for alert in alerts %}
  <div class="paragraph mb-2">
    <span class="text-small">{{ alert.created_at}}</span><br>
    <span class="paragraph__heading">{{ alert.title }}</span>
    <hr>
    <p>
  {{ alert.body }}
    </p>
  </div>
  <div>
  {% if alert.target %}
    {{ alert.target }}
  {% endif %}
  <br>
  <div>
{% endfor %}
    
{% endblock %}
