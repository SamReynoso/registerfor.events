{% extends "user/base.html" %}

{% block content %}
<p> This is the your profile.</p>
<a href="{% url 'details:profile' profile_id=user.profile.id%}">View public profile</a>

<div class="profile-image-container">
  <img src="{{ user.profile.get_avatar_url }}" class="thumbnail">
</div>
  <a href="{% url 'app:profile_avatar_update' %}">change</a>
  <a href="{% url 'app:profile_avatar_delete' %}">delete</a>


<table class='contact-info-table'>
  <tr>
    <th>First Name</th>
    <td>{{ user.profile.first_name }}</td>
  </tr>
  <tr>
    <th>Last Name</th>
    <td>{{ user.profile.last_name}}</td>
  </tr>
  <tr>
</table>
<a href="{% url 'app:profile_update' %}">edit</a>
{% endblock %}
