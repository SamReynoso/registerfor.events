{% extends "invoice/base.html" %}

{% block content %}

<section class="main-section">
  <h2>Event Invoices</h2>

  <div class="paragraph mb-3">
    <span class="paragraph__heading">View invoices for these events.</span>
    <p class="mb-2"></p>
    <hr>
  </div>


  <table class="item-table mt-2">
    <thead>
      <tr>
        <th></th>
        <th>Event</th>
        <th>End Date</th>
        <th>Registrations</th>
        <th></th>

        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for event in events %}
        <tr>
          <td></td>
          <td>{{ event.name }}</td>
          <td>{{ event.end_date|date:"m-d-y" }}</td>
          <td>{{ event.registrations.count }}</td>

          <td>
            <a href="{% url "invoice:event_invoices" event_id=event.id %}" class="inline-icon__link">
              <img src="/assets/icons/magnifying-glass.svg" class="inline-icon dark-invert">
            </a>
          </td>

          <td></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

</section>
{% endblock %}
