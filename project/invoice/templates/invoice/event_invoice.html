{% extends "invoice/base.html" %}

{% block content %}

<section class="main-section">
  <h1>Event Invoices</h1>

  <div class="paragraph mb-3">
    <p class="mb-2"></p>
    <span class="paragraph__heading"></span>
    <hr>
  </div>


  <table class="item-table mt-2">
    <thead>
      <tr>
        <th>Event</th>
        <th>End Date</th>
        <th></th>
        <th></th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for event in events %}
        <tr>
          <td>{{ event.name }}</td>
          <td>{{ event.end_date|date:"m-d-y" }}</td>
          <td>

              <img src="/assets/icons/magnifying-glass.svg" class="inline-icon">
              <a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

</section>
{% endblock %}
